name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        working-directory: core
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile prototype/chat.py prototype/eval.py prototype/make_dataset.py prototype/mn_parse.py prototype/test.py prototype/test_mn_parse.py scripts/download_model.py
      - run: python -m unittest discover -s prototype -p "test_*.py"
