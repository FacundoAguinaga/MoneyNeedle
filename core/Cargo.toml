[package]
name = "moneyneedle-core"
version = "0.1.0"
edition = "2021"
description = "Lógica compartida MoneyNeedle: modelos, validación, DB y bridges a Needle/STT"

[lib]
name = "moneyneedle_core"
crate-type = ["cdylib", "rlib"]

[features]
# Habilita el ejemplo FFI (necesita NEEDLE_LIB_DIR con libneedle.a).
needle-engine = []

[[example]]
name = "needle_smoke"
required-features = ["needle-engine"]

[[example]]
name = "pipeline_probe"
required-features = ["needle-engine"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.10", features = ["v7", "fast-rng"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
bip39 = "2.1"
base64 = "0.22"
