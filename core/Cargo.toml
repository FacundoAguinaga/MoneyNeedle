[package]
name = "moneyneedle-core"
version = "0.1.0"
edition = "2021"
description = "Lógica compartida MoneyNeedle: modelos, validación, DB y bridges a Needle/STT"

[lib]
name = "moneyneedle_core"
crate-type = ["cdylib", "rlib"]

[features]
# Habilita el ejemplo FFI (necesita NEEDLE_LIB_DIR con libneedle.a).
needle-engine = []

[[example]]
name = "needle_smoke"
required-features = ["needle-engine"]
